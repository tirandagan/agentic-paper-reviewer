name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib (calibration plot test)
        run: python -m pip install matplotlib
      - name: Offline checks (manifests, skill, scripts, hygiene)
        run: bash tests/run.sh
